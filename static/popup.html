<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>{{name}}</title>
<link rel="stylesheet" href="popup.css">
<script type="module" src="popup.js"></script>
</head>
<body>
<main class="panel">
  <header class="head">
    <img class="icon" src="icons/icon-32.png" alt="" width="20" height="20">
    <span id="name" class="name">{{name}}</span>
  </header>
  <div class="row">
    <span id="switch-label" class="label">Card hovers</span>
    <button id="enabled" class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="switch-label" aria-busy="true" disabled>
      <span class="knob" aria-hidden="true"></span>
    </button>
  </div>
  <div class="row needs-hovers">
    <span id="details-label" class="label">Card details</span>
    <button id="details" class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="details-label" aria-describedby="details-hint" aria-busy="true" disabled>
      <span class="knob" aria-hidden="true"></span>
    </button>
  </div>
  <p id="details-hint" class="hint needs-hovers">Type, stats and card text beside the picture.</p>
  <div class="dial needs-hovers">
    <div class="row">
      <label for="card-size" class="label">Card size</label>
      <output id="card-size-value" for="card-size" class="value">100%</output>
    </div>
    <input id="card-size" class="slider" type="range" min="70" max="130" step="10" value="100" disabled>
  </div>
  <p id="update" class="update" hidden>
    <a id="update-link" target="_blank" rel="noopener noreferrer"></a>
    <button id="update-dismiss" class="dismiss" type="button" aria-label="Dismiss">&times;</button>
  </p>
  <footer class="foot">
    <a id="project" target="_blank" rel="noopener noreferrer">Project page</a>
    <a id="runtime" target="_blank" rel="noopener noreferrer">Built on cardvision</a>
  </footer>
</main>
</body>
</html>
