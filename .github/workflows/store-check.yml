# SPDX-License-Identifier: Apache-2.0
#
# The store release's build and checks on every pull request, with the tag the version would get
# (the toolkit's docs/store-uploads.md, "Checking a pull request without a tag"). It is red only for
# a problem in the pull request itself. How much it checks depends on whether package.json's
# version is already released (its tag exists):
#
# - Not released yet (the version pull request, or a change that will ship in that version): the
#   same steps as the build job of store-release.yml. The tests, the store packages (npm run
#   store:build, with its source round trip and its check of the card release against
#   cdn/RUNTIMES.json), Mozilla's linter against store/lint-baseline.json, and `store-upload.mjs
#   check` on the release file of package.json's version. The addresses in the release file's
#   `before` list (the privacy page, when PRIVACY.md changed) are only warnings here
#   (scripts/store-before.mjs): they are published after the merge. The tag's build job checks
#   them again, and the upload job refuses to upload until they are live.
# - Already released (most pull requests): this commit will never ship as that version, so the
#   version's row in cdn/RUNTIMES.json, its release file and the permissions compared with the
#   release before it say nothing about it. The packages are still built with their round trip
#   (store:build --skip-runtimes-row), linted and checked against store/permissions.json. A
#   vendored runtime that the row no longer names, or permissions that changed since the tag, are
#   warnings for the next version pull request.
#
# This workflow has no store access and must never name a store credential.
name: Store check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: store-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TAG_PREFIX: v
  STORE_TOOL: vendor/cardvision-browser/node/store-upload.mjs

jobs:
  store-check:
    name: Store packages and check (no store access)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

      - name: The would-be tag, and whether it exists
        run: |
          tag="${TAG_PREFIX}$(node -p "require('./package.json').version")"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "RELEASED=true" >> "$GITHUB_ENV"
            echo "$tag is released: the release checks run on the next version pull request."
            printf '%s\n' "## Store check: $tag is already released" "" \
              "package.json's version is already released, so this pull request is not checked as that release (its cdn/RUNTIMES.json row, release file and permissions since the release before). The packages are built, round-tripped, linted and checked against store/permissions.json." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RELEASED=false" >> "$GITHUB_ENV"
            echo "$tag is not released yet: full release checks."
          fi

      - name: Build the store packages
        run: |
          npm run vendor-check
          if [ "$RELEASED" = true ]; then npm run store:build -- --skip-runtimes-row; else npm run store:build; fi

      - name: Lint the Firefox package
        run: |
          mkdir -p out/firefox && unzip -q -o out/firefox.zip -d out/firefox
          npx --yes web-ext@10.8.0 lint --source-dir out/firefox --output json > out/lint.json || true

      - name: The previous release's permissions
        if: env.RELEASED == 'false'
        run: |
          # The newest earlier release tag (pre-release tags such as v1.0.0-rc1 are left out).
          prev=$(git tag --list "${TAG_PREFIX}*" --sort=-v:refname --merged HEAD | while read -r t; do
            case "${t#"$TAG_PREFIX"}" in (*-*) continue ;; esac
            if [ "$t" != "$TAG" ]; then echo "$t"; break; fi
          done || true)
          if [ -n "$prev" ] && git cat-file -e "$prev:store/permissions.json" 2>/dev/null; then
            git show "$prev:store/permissions.json" > out/previous-permissions.json
            echo "PREVIOUS=--previous-permissions out/previous-permissions.json" >> "$GITHUB_ENV"
          fi

      - name: Since the release (warnings for the next version)
        if: env.RELEASED == 'true'
        run: |
          version="${TAG#"$TAG_PREFIX"}"
          row=$(node -p "(require('./cdn/RUNTIMES.json')['$version'] ?? {}).vendoredCommit ?? ''")
          vendored=$(node -p "require('./vendor/cardvision-browser/cardvision-vendor.json').toolkit.commit")
          if [ "$row" != "$vendored" ]; then
            echo "::warning title=Next version::The vendored toolkit is $vendored; $version shipped ${row:-an unrecorded commit}. The next version's row in cdn/RUNTIMES.json names $vendored."
          fi
          if git cat-file -e "$TAG:store/permissions.json" 2>/dev/null && ! git diff --quiet "$TAG" HEAD -- store/permissions.json; then
            echo "::warning title=Next version::store/permissions.json changed since $TAG: the next release file sets permissionsChanged."
          fi

      - name: The release file, its before addresses as warnings
        run: |
          version="${TAG#"$TAG_PREFIX"}"
          released=""
          if [ "$RELEASED" = true ]; then released="--released"; fi
          node scripts/store-before.mjs --release "store/releases/$version.json" \
            --out "store/releases/$version.pr-check.json" $released

      - name: Check the packages and the release
        run: |
          version="${TAG#"$TAG_PREFIX"}"
          node "$STORE_TOOL" check --config store/store.config.json --release "store/releases/$version.pr-check.json" \
            --tag "$TAG" --tag-prefix "$TAG_PREFIX" --permissions store/permissions.json $PREVIOUS \
            --chrome-zip out/chrome.zip --firefox-zip out/firefox.zip --firefox-source out/firefox-source.zip \
            --workflow .github/workflows/store-release.yml --workflow .github/workflows/store-check.yml \
            --lint out/lint.json --lint-baseline store/lint-baseline.json --summary "$GITHUB_STEP_SUMMARY"
